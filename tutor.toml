# Tutor configuration (architecture §11). Committed; holds NO secrets — API keys come only from
# the environment or .env. Any key can be overridden by an env var TUTOR__SECTION__KEY, e.g.
# TUTOR__SQL__MAX_ROWS=50. Unknown keys are an error. Relative paths are relative to the repo root.

[paths]
capture_db = "data/capture.db"                 # live capture DB, opened mode=ro (D-015)
eval_capture_db = "data/reference/capture.db"  # frozen copy, the only source of real eval cases (D-016)
analysis_db = "data/analysis.db"
fixture_db = "evals/fixtures/progress.db"
verdicts = "data/labels/verdicts.csv"          # hand-backfilled verdicts (D-005)
logs = "logs"

[capture]
submits_reliable_since = "2026-11-04"  # human, T-001: submit capture verified 2026-11-03 (D-024)

[time]
timezone = "America/New_York"

[condenser]
interval_s = 120
error_max_chars = 500
token_budget = 16000          # estimated tokens (chars / 4)
rewrite_threshold = 0.5

[llm]
default = "openai:gpt-5.5"                   # D-018; confirm the model id
generator = "anthropic:claude-opus-5-5"      # synthetic-session generator (D-017)
max_output_retries = 1
max_transient_retries = 3
timeout_s = 60
# judge = "provider:model"                   # unset -> default
# [llm.fields]                               # per-field override, e.g. failure = "openai:..."

[prompts]
# <name> = "v1"                              # pinned version per prompt
algorithm = "v1"

[agent]
max_steps = 10

[sql]
timeout_s = 5
max_rows = 200
