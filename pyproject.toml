[project]
name = "tutor"
version = "0.1.0"
description = "LeetCode Tutor Agent: session analyzer (Part 1) and progress agent (Part 2). A learning project."
requires-python = ">=3.13"
dependencies = [
    "openai>=1.66",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.scripts]
tutor = "tutor.cli:main"
tutor-eval = "tutor.cli:eval_main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tutor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Lint + type gate (T-013, D-031): `uv run ruff check src tests && uv run mypy`
[tool.ruff]
target-version = "py313"
src = ["src", "tests"]
# Dataset code (synthetic sessions' final code) is data, not project code: unfinished or buggy on
# purpose. Linting it would "fix" the very behaviour the evals measure (D-043).
extend-exclude = ["evals/data"]

[tool.ruff.lint]
# The lean gate the human chose (D-031): pyflakes (F: undefined names, unused imports and
# variables) and pycodestyle's error classes E4/E7/E9 (import placement, statement errors,
# syntax). Named explicitly because ruff's own default set changes between releases.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.13"
files = ["src"]          # src/ only: tests are not type-checked (D-031)
mypy_path = "src"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
