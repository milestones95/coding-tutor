[project]
name = "tutor"
version = "0.1.0"
description = "LeetCode Tutor Agent: session analyzer (Part 1) and progress agent (Part 2). A learning project."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.scripts]
tutor = "tutor.cli:main"
tutor-eval = "tutor.cli:eval_main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tutor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
